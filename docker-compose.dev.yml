# Development: only the database in Docker, the apps run with hot reload (npm run dev:api / npm run dev:web).
#   docker compose -f docker-compose.dev.yml up -d
name: talal-at-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talal_at
      POSTGRES_USER: talal
      POSTGRES_PASSWORD: talal_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talal -d talal_at"]
      interval: 5s
      retries: 12

volumes:
  dev-db-data:
