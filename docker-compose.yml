# TALAL·AT: website (Next.js) + API (NestJS) + PostgreSQL + Caddy, one command:
#   cp .env.example .env   (then edit the passwords)
#   docker compose up -d --build
# Open http://localhost  ·  admin at http://localhost/admin

name: talal-at

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talal_at}
      POSTGRES_USER: ${POSTGRES_USER:-talal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: talal-at-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-talal_at}
      POSTGRES_USER: ${POSTGRES_USER:-talal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      IP_SALT: ${IP_SALT:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${SITE_URL:-http://localhost}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PAYMENT_LINK: ${PAYMENT_LINK:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-talalatallah10@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    image: talal-at-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
      PAYMENT_LINK: ${PAYMENT_LINK:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
    networks: [frontend]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
